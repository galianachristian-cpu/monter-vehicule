<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Montée en véhicule</title>
<meta name="description" content="Contrôle des engins à la prise de garde — CS Cruzy / Quarante">
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Montée véhicule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d11; --bg2:#10131a; --panel:#151922; --panel2:#1b202b; --line:#262c39; --line2:#323a4a;
  --txt:#f2f4f8; --mut:#8d95a8; --mut2:#5f677a;
  --red:#e5232c; --red2:#ff4a50; --redd:#8f0f16;
  --amb:#ffae1f; --grn:#27cf7c; --blue:#3d8bff;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 'Barlow',system-ui,sans-serif}
body{min-height:100vh;overflow-x:hidden;
  background:radial-gradient(900px 420px at 85% -120px,rgba(229,35,44,.22),transparent 70%),
             radial-gradient(700px 360px at -10% -80px,rgba(255,120,40,.08),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt)}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
#app{max-width:680px;margin:0 auto;padding:calc(var(--safe-t) + 0px) 16px calc(110px + var(--safe-b))}

/* ---------- en-tête ---------- */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 70%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.top .emb{width:42px;height:42px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font:800 21px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.top small{display:block;color:var(--mut);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut);padding:7px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.chip-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px rgba(39,207,124,.18)}
.chip-sync.off .dot{background:var(--amb);box-shadow:0 0 0 3px rgba(255,174,31,.18)}
.chip-sync.demo .dot{background:var(--blue);box-shadow:0 0 0 3px rgba(61,139,255,.18)}
.chip-sync.spin .ico{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- blocs ---------- */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-t{font:700 14px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 2px 12px;display:flex;align-items:center;gap:8px}
.sec-t b{color:var(--txt)}
.sec-t .ln{flex:1;height:1px;background:var(--line)}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;
  font-weight:700;font-size:16px;background:var(--panel2);border:1px solid var(--line2);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.red{background:linear-gradient(180deg,var(--red2),var(--red));border-color:#ff6a6f;box-shadow:0 10px 28px -10px rgba(229,35,44,.7)}
.btn.grn{background:linear-gradient(180deg,#36e08d,#1fae67);border-color:#4fe89c;color:#05140c;box-shadow:0 10px 28px -10px rgba(39,207,124,.6)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--panel2);color:var(--mut);border:1px solid var(--line2);white-space:nowrap}
.pill.ok{color:#7ff0b5;background:rgba(39,207,124,.12);border-color:rgba(39,207,124,.35)}
.pill.warn{color:#ffd27a;background:rgba(255,174,31,.12);border-color:rgba(255,174,31,.38)}
.pill.bad{color:#ff9a9e;background:rgba(229,35,44,.16);border-color:rgba(229,35,44,.5)}
.pill.blue{color:#9cc3ff;background:rgba(61,139,255,.14);border-color:rgba(61,139,255,.4)}

/* ---------- garde ---------- */
.garde{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:22px;border:1px solid #3a1c21;
  background:linear-gradient(135deg,#2a0d11 0%,#17090c 55%,#120d10 100%)}
.garde:before{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(229,35,44,.4),transparent)}
.garde .lbl{font:700 13px/1 var(--cond);letter-spacing:.14em;color:#ff8f93;text-transform:uppercase}
.garde .day{font:800 30px/1.05 var(--cond);margin:6px 0 12px}
.garde .day::first-letter{text-transform:uppercase}
.garde .prog{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.garde .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),#ff8a3c);transition:width .6s}
.garde .meta{display:flex;justify-content:space-between;margin-top:9px;font-size:14px;color:#e6c3c5}
.garde .meta b{color:#fff}

/* ---------- véhicules ---------- */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vcard{position:relative;text-align:left;display:flex;flex-direction:column;border-radius:20px;padding:10px 12px 12px;
  background:linear-gradient(180deg,#1a1f2a,#12151c);border:1px solid var(--line);transition:transform .12s,border-color .2s;overflow:hidden}
.vcard:active{transform:scale(.97)}
.vcard .vimg{margin:2px -4px 4px;aspect-ratio:260/120}
.vcard .vimg svg{width:100%;height:100%}
.vcard .vn{font:800 21px/1 var(--cond);letter-spacing:.02em}
.vcard .vp{font-size:12px;color:var(--mut);margin-top:3px;letter-spacing:.04em;min-height:16px}
.vcard .vs{margin-top:9px}
.vcard .vk{margin-top:7px;font:700 15px/1 var(--cond);color:#c9cfdb;letter-spacing:.03em}
.vcard.st-ok{border-color:rgba(39,207,124,.35)}
.vcard.st-bad{border-color:rgba(229,35,44,.55);background:linear-gradient(180deg,#26131a,#12151c)}
.vcard .bdg{position:absolute;top:10px;right:10px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--amb);color:#231500}
.vcard .bdg.bad{background:var(--red);color:#fff}

.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe-b));z-index:30;
  display:flex;align-items:center;gap:10px;height:58px;padding:0 26px;border-radius:99px;font:800 19px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 14px 34px -8px rgba(229,35,44,.75),0 0 0 6px rgba(11,13,17,.9);white-space:nowrap}
.cta:active{transform:translateX(-50%) scale(.96)}

/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(14,16,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b))}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut2);padding:4px 0;position:relative}
.nav button.on{color:var(--txt)}
.nav button.on .ico{color:var(--red2)}
.nav .nb{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* ---------- listes ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.li:active{background:var(--panel2)}
.li .lic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel2)}
.li .lt{font-weight:700}
.li .ls{font-size:13px;color:var(--mut)}
.li .chev{color:var(--mut2)}
.li.g-mineur{border-left:4px solid var(--amb)}
.li.g-majeur{border-left:4px solid #ff7a2f}
.li.g-indispo{border-left:4px solid var(--red)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty .big{font:800 22px/1.1 var(--cond);color:var(--txt);margin:10px 0 4px}
.day-h{font:700 13px/1 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mut)}
.chip.on{background:var(--txt);color:#0b0d11;border-color:var(--txt)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{height:40px;border-radius:10px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--txt);box-shadow:0 1px 0 var(--line2) inset}

/* ---------- formulaires ---------- */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 6px}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;background:#0e1117;border:1px solid var(--line2);outline:none;font-size:16px}
.inp:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(229,35,44,.2)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;min-height:44px;border-radius:12px;background:#0e1117;border:1px solid var(--line2);font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on.g-mineur{background:#7a5200}
.seg button.on.g-majeur{background:#9a3d0a}
.seg button.on.g-indispo{background:var(--red)}
.seg button.on.def{background:var(--txt);color:#0b0d11}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--red)}

/* ---------- assistant de montée ---------- */
.wz-top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + var(--safe-t)) 16px 12px;background:rgba(11,13,17,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wz-top .row{gap:12px}
.wz-top .vmini{width:74px;flex:none}
.wz-top h2{margin:0;font:800 22px/1 var(--cond)}
.wz-top .st{font-size:13px;color:var(--mut);margin-top:3px}
.steps{display:flex;gap:4px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.s-done{background:#7d2a30}
.steps i.s-cur{background:var(--red2)}
.wz-h{font:800 30px/1.05 var(--cond);margin:22px 2px 4px}
.wz-sub{color:var(--mut);margin:0 2px 18px}
.wz-bot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}
.wz-bot .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.wz-bot .btn{flex:1;min-height:56px;font-size:17px}
.wz-bot .btn.back{flex:0 0 56px;padding:0}

.odo{display:flex;align-items:baseline;gap:10px;background:#07090c;border:1px solid var(--line2);border-radius:18px;padding:16px 18px;
  box-shadow:inset 0 2px 14px rgba(0,0,0,.6)}
.odo input{flex:1;min-width:0;background:none;border:0;outline:none;font:700 44px/1 var(--cond);letter-spacing:.08em;color:#ffe9b0}
.odo input::placeholder{color:#3b3424}
.odo span{font:700 20px/1 var(--cond);color:var(--mut)}
.odo-h{display:flex;justify-content:space-between;gap:8px;margin:10px 4px 14px;font-size:14px;color:var(--mut)}
.odo-h b{color:var(--txt)}
.odo-h .warn{color:var(--amb);font-weight:700}
.shot{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.shot img{width:110px;height:44px;object-fit:cover;border-radius:8px;background:#000}

.lvl{padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.lvl .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lvl .hd .nm{flex:1;font-weight:700;font-size:17px}
.lvl .hd .val{font:800 22px/1 var(--cond)}
.gauge{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gauge button{height:46px;border-radius:10px;background:#0e1117;border:1px solid var(--line2);position:relative}
.gauge button.on{border-color:transparent}
.gauge button span{position:absolute;bottom:-18px;left:0;right:0;font-size:11px;color:var(--mut2);font-weight:600}
.lvl .ft{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.tog{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;border:1px solid var(--line2);font-weight:700;font-size:14px;color:var(--mut)}
.tog.on{background:rgba(39,207,124,.14);border-color:rgba(39,207,124,.45);color:#86f2bb}

.ess{padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.ess.def{border-color:rgba(229,35,44,.55);background:linear-gradient(180deg,#23131a,var(--panel))}
.ess .hd{display:flex;align-items:center;gap:12px}
.ess .nm{font-weight:700}
.ess .ds{font-size:13px;color:var(--mut)}
.tri{display:flex;gap:6px;flex:none}
.tri button{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#0e1117;border:1px solid var(--line2);color:var(--mut2)}
.tri button.on.ok{background:var(--grn);border-color:var(--grn);color:#04140b}
.tri button.on.ko{background:var(--red);border-color:var(--red);color:#fff}
.tri button.na{width:auto;padding:0 10px;font-size:12px;font-weight:800}
.tri button.on.na{background:var(--line2);color:var(--txt)}
.ess .more{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.phs .ph{position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;background:#000}
.phs .ph img{width:100%;height:100%;object-fit:cover}
.phs .ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center}
.phs .ph button .ico{width:14px;height:14px}
.phs .add{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--mut)}

.armsec{border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}
.armsec .hd{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.ring{width:40px;height:40px;flex:none}
.armsec .nm{font-weight:700}
.armsec .ds{font-size:13px;color:var(--mut)}
.armsec .body{border-top:1px solid var(--line);padding:6px 10px 12px}
.it{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #1d222d}
.it:last-child{border-bottom:0}
.it .q{flex:none;width:34px;height:28px;border-radius:8px;display:grid;place-items:center;background:#0e1117;font:800 15px/1 var(--cond);color:#cfd5e1}
.it .l{flex:1;min-width:0;font-size:15px;font-weight:600}
.it .l small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;line-height:1.3}
.it .tri button{width:40px;height:40px;border-radius:11px}
.it.ko .q{background:var(--red);color:#fff}
.it-note{margin:2px 0 6px 44px}

.sou{padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.qchips button{padding:6px 10px;border-radius:99px;border:1px solid var(--line2);font-size:13px;color:var(--mut);font-weight:600}

.rec{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.rec .t{font-weight:700}
.rec .d{font-size:14px;color:var(--mut)}
.rec .d b{color:var(--txt)}

.done{text-align:center;padding:40px 10px 20px}
.done .ok{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#36e08d,#16904f);box-shadow:0 0 0 12px rgba(39,207,124,.12),0 0 60px rgba(39,207,124,.45);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done .ok .ico{width:60px;height:60px;color:#04140b;stroke-width:3}
.done h2{font:800 40px/1 var(--cond);margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* ---------- connexion ---------- */
.splash{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding:30px 0}
.splash .emb{width:110px;height:110px;margin:0 auto 18px;filter:drop-shadow(0 16px 30px rgba(229,35,44,.45))}
.splash h1{text-align:center;font:800 40px/.95 var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:0}
.splash .sub{text-align:center;color:var(--mut);margin:10px 0 28px}
.splash .sub b{color:#ff9a9e;font-weight:700}

/* ---------- feuille / modale ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);
  border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--safe-b));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .in{max-width:680px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font:800 26px/1.05 var(--cond);margin:4px 0 6px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#000}
.zoom{position:fixed;inset:0;z-index:80;background:#000;display:grid;place-items:center}
.zoom img{max-width:100%;max-height:100%}

.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:90;background:#fff;color:#0b0d11;font-weight:700;
  padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100% - 32px);animation:drop .3s}
.toast.bad{background:var(--red);color:#fff}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}

/* ---------- lecture du compteur ---------- */
.scan{position:fixed;inset:0;z-index:70;background:#000;color:#fff}
.scan video,.scan canvas.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .mask{position:absolute;inset:0;pointer-events:none}
.scan .frame{position:absolute;left:7%;right:7%;top:36%;height:17%;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.6)}
.scan .frame:before,.scan .frame:after{content:"";position:absolute;inset:-3px;border-radius:18px;border:3px solid transparent;
  border-top-color:var(--red2);border-bottom-color:var(--red2);clip-path:polygon(0 0,18% 0,18% 100%,0 100%,0 0,82% 0,100% 0,100% 100%,82% 100%,82% 0)}
.scan .frame:after{border-color:transparent;border-left-color:var(--red2);border-right-color:var(--red2);clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%)}
.scan .frame.sq{left:50%;top:30%;width:min(72vw,320px);height:min(72vw,320px);margin-left:calc(min(72vw,320px) / -2)}
.scan .laser{position:absolute;left:4%;right:4%;height:2px;top:50%;background:linear-gradient(90deg,transparent,var(--red2),transparent);animation:las 1.6s ease-in-out infinite alternate;opacity:.85}
@keyframes las{from{top:12%}to{top:88%}}
.scan .tip{position:absolute;left:16px;right:16px;top:calc(22% - 30px);text-align:center;font:700 22px/1.15 var(--cond);text-shadow:0 2px 8px #000}
.scan .tip small{display:block;font:500 14px/1.3 'Barlow',sans-serif;color:#cfd3dc;margin-top:6px}
.scan .bar{position:absolute;left:0;right:0;bottom:0;padding:20px 24px calc(28px + var(--safe-b));display:flex;align-items:center;justify-content:space-between}
.scan .rb{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;backdrop-filter:blur(6px)}
.scan .rb.on{background:#ffd24a;color:#000}
.scan .shoot{width:82px;height:82px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}
.scan .shoot i{width:64px;height:64px;border-radius:50%;background:var(--red2)}
.scan .res{position:absolute;inset:auto 0 0 0;background:var(--bg2);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--safe-b));animation:up .25s}
.scan .res .in{max-width:680px;margin:0 auto}
.scan .res img{width:100%;max-height:110px;object-fit:contain;border-radius:12px;background:#000;margin-bottom:12px}
.scan .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font:700 20px var(--cond);letter-spacing:.05em}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--red2);animation:rot .8s linear infinite;margin:0 auto 12px}

.kmchart{width:100%;height:120px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kv b{display:block;font:800 22px/1 var(--cond)}
.kv span{font-size:12px;color:var(--mut)}
.hero{position:relative;margin:4px -16px 0;padding:6px 16px 0}
.hero svg{width:100%;max-width:520px;margin:0 auto}
.hero h2{font:800 40px/1 var(--cond);margin:4px 0 2px}
.qr{background:#fff;border-radius:16px;padding:14px;width:min(260px,100%);margin:12px auto}
.qr svg{width:100%;height:auto}
code.tok{display:block;word-break:break-all;font-size:12px;background:#0e1117;border:1px solid var(--line2);padding:10px;border-radius:10px;color:var(--mut)}
.qrbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:left}
.qrbtn .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#f7d84a;color:#1a1400;flex:none}
.qrbtn b{display:block}
.hyg{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;margin-bottom:12px;border:1px solid var(--line);background:var(--panel)}
.hyg.on{border-color:rgba(39,207,124,.5);background:linear-gradient(180deg,rgba(39,207,124,.12),var(--panel))}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sugg button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#0e1117;border:1px solid var(--line2);text-align:left;font-weight:600}
.sugg button.on{border-color:var(--red2);background:rgba(229,35,44,.14)}
.sugg .gr{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700}
.prow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #1d222d}
.prow:last-child{border-bottom:0}
.prow .gr,.cp{font-size:12px;font-weight:700;color:var(--mut);background:var(--panel2);padding:3px 8px;border-radius:99px;white-space:nowrap}
.cp.fdf{color:#ffc078;background:rgba(255,138,31,.14)}
.cps{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.vedit{padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}

const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const GH = {
  base() { return `https://api.github.com/repos/${S.cfg.o}/${S.cfg.r}`; },
  async api(path, opt = {}) {
    const headers = { Authorization: 'Bearer ' + S.cfg.t, Accept: opt.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (opt.body) headers['Content-Type'] = 'application/json';
    return fetch(this.base() + path, { method: opt.method || 'GET', headers, body: opt.body, cache: 'no-store' });
  },
  async list() {
    const r = await this.api(`/git/trees/${encodeURIComponent(S.cfg.b || 'main')}?recursive=1`);
    if (r.status === 404 || r.status === 409) return [];
    if (!r.ok) throw new Error('Lecture impossible (' + r.status + ')');
    const j = await r.json();
    return j.tree.filter(x => x.type === 'blob').map(x => ({ p: x.path, s: x.sha }));
  },
  async getMeta(p) {
    const r = await this.api(`/contents/${encPath(p)}?ref=${encodeURIComponent(S.cfg.b || 'main')}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Lecture ' + r.status);
    const j = await r.json();
    let txt;
    if (j.content) txt = utf8b64(j.content);
    else { const rr = await this.api(`/git/blobs/${j.sha}`); txt = utf8b64((await rr.json()).content); }
    return { j: JSON.parse(txt), s: j.sha };
  },
  async put(p, b64, msg, sha) {
    for (let k = 0; k < 4; k++) {
      const r = await this.api(`/contents/${encPath(p)}`, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64, branch: S.cfg.b || 'main', ...(sha ? { sha } : {}) }) });
      if (r.ok) { const j = await r.json(); return j.content && j.content.sha; }
      if (r.status === 422 && !sha) return 'deja';            // fichier déjà envoyé (nouvel essai)
      if (r.status === 401 || r.status === 403) throw new Error('Accès refusé par GitHub (' + r.status + '). Le jeton est peut-être expiré.');
      if (r.status !== 409 && r.status < 500) throw new Error('Envoi refusé (' + r.status + ')');
      await sleep(600 * (k + 1) + Math.random() * 500);
    }
    throw new Error('GitHub ne répond pas, nouvel essai plus tard');
  },
  putJSON(p, obj, msg, sha) { return this.put(p, b64utf8(JSON.stringify(obj, null, 1)), msg, sha); },
  putImage(p, dataUrl, msg) { return this.put(p, dataUrl.split(',')[1], msg); },
  async del(p, sha, msg) {
    for (let k = 0; k < 4; k++) {
      const r = await this.api(`/contents/${encPath(p)}`, { method: 'DELETE', body: JSON.stringify({ message: msg, sha, branch: S.cfg.b || 'main' }) });
      if (r.ok || r.status === 404) return;
      if (r.status !== 409 && r.status < 500) throw new Error('Suppression refusée (' + r.status + ')');
      await sleep(600 * (k + 1));
    }
  },
  async imageUrl(p) {
    const r = await this.api(`/contents/${encPath(p)}?ref=${encodeURIComponent(S.cfg.b || 'main')}`, { accept: 'application/vnd.github.raw+json' });
    if (!r.ok) throw new Error('photo');
    return URL.createObjectURL(await r.blob());
  },
  async test() {
    const r = await fetch(`https://api.github.com/repos/${S.cfg.o}/${S.cfg.r}`, { headers: { Authorization: 'Bearer ' + S.cfg.t, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status === 404) throw new Error('Dépôt introuvable ou jeton sans accès à ce dépôt');
    if (r.status === 401) throw new Error('Jeton invalide ou expiré');
    if (!r.ok) throw new Error('Erreur GitHub ' + r.status);
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error('Le jeton n’a pas le droit d’écrire dans ce dépôt');
    return j.default_branch || 'main';
  }
};

  async list() { const d = this.db(); return Object.keys(d).map(p => ({ p, s: d[p].s })); },
  async getMeta(p) { const d = this.db()[p]; return d ? { j: JSON.parse(d.c), s: d.s } : null; },

function treeAdd(p, s) { S.tree = S.tree.filter(x => x.p !== p); S.tree.push({ p, s: s || 'local' }); LS.set('mv.tree', S.tree); reindex(); }
function treeDel(p) { S.tree = S.tree.filter(x => x.p !== p); LS.set('mv.tree', S.tree); reindex(); }
function cachePut(p, s, j) {
  S.files[p] = { s, j, t: Date.now() };
  const keys = Object.keys(S.files);
  if (keys.length > 400) keys.sort((a, b) => S.files[a].t - S.files[b].t).slice(0, 100).forEach(k => delete S.files[k]);
  if (!LS.set('mv.files', S.files)) { S.files = {}; LS.set('mv.files', {}); }
}
async function readJSON(p) {
  const t = S.tree.find(x => x.p === p), c = S.files[p];
  if (c && (!t || c.s === t.s || t.s === 'local')) return c.j;
  const m = await Store().getMeta(p);
  if (!m) return c ? c.j : null;
  cachePut(p, m.s, m.j);
  return m.j;
}

/* ---------- synchronisation ---------- */
async function sync(quiet) {
  if (!S.cfg || S.syncing) return;
  S.syncing = true; paintSync();
  try {
    S.tree = await Store().list();
    // les envois encore en attente restent visibles
    for (const it of S.outbox) { if (it.path) treeAddSilent(it.path); for (const a of it.anos || []) treeAddSilent(a.path); }
    LS.set('mv.tree', S.tree); reindex();
    S.online = true;
    const cf = S.tree.find(x => x.p === 'config.json');
    if (cf && (!S.confSha || S.confSha !== cf.s)) {
      const j = await readJSON('config.json');
      if (j) { S.conf = Object.assign({}, DEFAULT_CONF, j); S.confSha = cf.s; LS.set('mv.conf', S.conf); }
    } else if (!cf) S.confSha = null;
    await Promise.all(IDX.open.map(a => readJSON(a.p).catch(() => null)));
  } catch (e) {
    S.online = false;
    if (!quiet) toast(navigator.onLine ? e.message : 'Hors ligne : données gardées sur le téléphone', true);
  }
  S.syncing = false;
  render();
  flush();
}
function treeAddSilent(p) { if (!S.tree.some(x => x.p === p)) S.tree.push({ p, s: 'local' }); }

async function flush() {
  if (!S.cfg || S.flushing || !S.outbox.length) return;
  S.flushing = true; paintSync();
  const st = Store();
  try {
    while (S.outbox.length) {
      const it = S.outbox[0];
      for (const ph of it.photos || []) if (!ph.done) { await st.putImage(ph.path, ph.data, 'Photo ' + ph.path.split('/').pop()); ph.done = true; ph.data = null; LS.set('mv.outbox', S.outbox); }
      for (const a of it.anos || []) if (!a.done) { const s = await st.putJSON(a.path, a.obj, `Défaut ${a.obj.vehicule.nom} : ${a.obj.titre}`); a.done = true; cachePut(a.path, s, a.obj); treeAdd(a.path, s); LS.set('mv.outbox', S.outbox); }
      for (const x of it.extra || []) if (!x.done) { const s = await st.putJSON(x.path, x.obj, x.msg || 'Montée en véhicule'); x.done = true; treeAdd(x.path, s); LS.set('mv.outbox', S.outbox); }
      for (const r of it.resolve || []) if (!r.done) { await resolveNow(r.name, r.res); r.done = true; LS.set('mv.outbox', S.outbox); }
      if (it.path && !it.ok) { const s = await st.putJSON(it.path, it.ctrl, `Montée ${it.ctrl.vehicule.nom} — ${it.ctrl.auteur.nom}`); it.ok = true; cachePut(it.path, s, it.ctrl); treeAdd(it.path, s); }
      S.outbox.shift(); LS.set('mv.outbox', S.outbox);
    }
    S.online = true;
  } catch (e) {
    S.online = false;
    console.warn(e);
    if (navigator.onLine && /refus|Accès/.test(e.message)) toast(e.message, true);
  }
  S.flushing = false; paintSync();
  if (S.view === 'home' || S.view === 'reglages') render();
}
async function resolveNow(name, res) {
  const st = Store(), from = `anomalies/ouvertes/${name}.json`, to = `anomalies/resolues/${name}.json`;
  const m = await st.getMeta(from);
  if (!m) { treeDel(from); return; }                 // déjà réglé par quelqu'un d'autre
  const obj = Object.assign({}, m.j, { statut: 'resolu', resolution: res });
  const s = await st.putJSON(to, obj, `Réglé ${obj.vehicule.nom} : ${obj.titre}`);
  await st.del(from, m.s, `Réglé ${obj.vehicule.nom} : ${obj.titre}`);
  cachePut(to, s, obj); treeDel(from); treeAdd(to, s);
}
function queue(item) { S.outbox.push(item); if (!LS.set('mv.outbox', S.outbox)) { // photos trop lourdes : on les retire de la file
    item.photos = []; LS.set('mv.outbox', S.outbox); toast('Mémoire pleine : envoi sans les photos', true); }
  if (item.path) treeAdd(item.path, 'local');
  for (const x of item.extra || []) treeAdd(x.path, 'local');
  for (const a of item.anos || []) { cachePut(a.path, 'local', a.obj); treeAdd(a.path, 'local'); }
  for (const r of item.resolve || []) { const f = `anomalies/ouvertes/${r.name}.json`; const c = S.files[f]; treeDel(f); if (c) { const to = `anomalies/resolues/${r.name}.json`; cachePut(to, 'local', Object.assign({}, c.j, { statut: 'resolu', resolution: r.res })); treeAdd(to, 'local'); } }
  if (item.path) cachePut(item.path, 'local', item.ctrl);
  flush();
}

}
async function openScan(field) {
  SCAN.field = field;

  layer.innerHTML = `<div class="scan" id="scan">
    <video id="scv" playsinline autoplay muted></video>
    <div class="frame" id="scf"><div class="laser"></div></div>
    <div class="tip">Cadre les chiffres du compteur<small>Tiens le téléphone bien droit, sans reflet</small></div>
    <div class="bar"><button class="rb" data-act="scanClose">${ico('x')}</button><button class="shoot" data-act="scanShoot"><i></i></button><button class="rb" id="sct" data-act="scanTorch">${ico('flash')}</button></div>
  </div>`;
  try {
    SCAN.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const vd = $('#scv'); vd.srcObject = SCAN.stream; await vd.play().catch(() => {});
    const tr = SCAN.stream.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
    if (!caps.torch) $('#sct').style.visibility = 'hidden';
    try { if (caps.focusMode && caps.focusMode.includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  } catch (e) {
    closeScan();
    pickPhoto(async (dataUrl, img) => { const c = cropCenter(img); await runOcr(c); }, true);
  }
}
function closeScan() { if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop()); SCAN.stream = null; layer.innerHTML = ''; }

  const vd = $('#scv'), fr = $('#scf').getBoundingClientRect(), el = vd.getBoundingClientRect();
  const vw = vd.videoWidth, vh = vd.videoHeight; if (!vw) return null;
  const sc = Math.max(el.width / vw, el.height / vh), ox = (el.width - vw * sc) / 2, oy = (el.height - vh * sc) / 2;
  const sx = (fr.left - el.left - ox) / sc, sy = (fr.top - el.top - oy) / sc, sw = fr.width / sc, sh = fr.height / sc;
  const c = document.createElement('canvas'); c.width = Math.round(sw); c.height = Math.round(sh);

  c.width = Math.round(sw); c.height = Math.round(sh);

function pickPhoto(cb, raw) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return; try { const { url, img } = await compress(f); cb(url, img); } catch (e) { toast('Photo illisible', true); } };

function parsePompiers(txt) {
  const out = [];
  for (const line of String(txt).split(/\r?\n/)) {
    const cols = line.split(/\t|;/).map(x => x.trim()).filter(Boolean);
    if (!cols.length) continue;
    const nom = nomPropre(cols[0].replace(/^\d+\s*[.)-]?\s+/, ''));
    if (nom.length < 3 || !/[a-zà-ÿ]/i.test(nom) || /^nom/i.test(nom)) continue;
    const grade = (cols[1] || '').length <= 6 && !normFdf(cols[1]) ? (cols[1] || '').toUpperCase() : '';
    let fdf = '', comp = [];
    for (const c of cols.slice(grade ? 2 : 1)) {
      if (normFdf(c)) fdf = normFdf(c);
      else if (/^[A-Za-zÀ-ÿ/]{2,6}\s?\d?$/.test(c)) comp = comp.concat(compList(c));   // COD 2, SAP 1… (pas les téléphones)
    }
    out.push({ nom, grade, fdf, comp });
  }
  return out;
}
async function savePompiers(list) {
  const seen = new Set(), L = [];
  for (const p of list) { const k = norm(p.nom); if (!k || seen.has(k)) continue; seen.add(k); L.push({ nom: p.nom, grade: p.grade || '', fdf: p.fdf || '', comp: [...new Set(p.comp || [])] }); }
  return saveConf(Object.assign({}, S.conf, { pompiers: L }));
}

const QRS = { stream: null, timer: null, mode: 'go', vid: null, key: null };
const appBase = () => location.origin + location.pathname;
function qrKey(t) { const m = String(t).match(/forms\/d\/(?:e\/)?([A-Za-z0-9_-]{10,})/); return m ? 'form:' + m[1] : String(t).trim().slice(0, 300); }
function qrVehicle(t) {

async function openQrScan(mode, vid) {

    <video id="qrv" playsinline autoplay muted></video>
    <div class="frame sq"><div class="laser"></div></div>

    <div class="bar"><button class="rb" data-act="qrClose">${ico('x')}</button><span></span><span style="width:54px"></span></div>
  </div>`;
  let det = null;
  if ('BarcodeDetector' in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
  if (!det) loadScript(JSQR).catch(() => {});
  try { QRS.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); }
  catch (e) { closeQr(); toast('Caméra indisponible : autorise l’appareil photo', true); return; }
  const vd = $('#qrv'); if (!vd) { closeQr(); return; }
  vd.srcObject = QRS.stream; await vd.play().catch(() => {});
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!QRS.stream) return;
    let txt = null;
    if (vd.videoWidth) {
      try {
        if (det) { const r = await det.detect(vd); if (r[0]) txt = r[0].rawValue; }
        else if (window.jsQR) { const w = 720, h = Math.round(vd.videoHeight * w / vd.videoWidth); cv.width = w; cv.height = h; cx.drawImage(vd, 0, 0, w, h); const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); if (r && r.data) txt = r.data; }
      } catch (e) {}

  };

}
function closeQr() { clearTimeout(QRS.timer); if (QRS.stream) QRS.stream.getTracks().forEach(t => t.stop()); QRS.stream = null; layer.innerHTML = ''; }
async function onQr(txt) {

});

  if (e.target.id === 'lg-nom' && $('#lg-sugg')) { $('#lg-sugg').innerHTML = suggHtml(e.target.value); return; }
  if (e.target.id === 'pp-q') { $('#pp-list').innerHTML = pompRows(e.target.value); return; }
  const el = e.target; if (!el.dataset || !el.dataset.in || !W) return;
  const k = el.dataset.in;
  if (k === 'km' || k === 'hp') {
    const v = el.value.replace(/\D/g, '').slice(0, 7); if (v !== el.value) el.value = v; W[k] = v;
    if (k === 'km') { W.lu = false; const hEl = $('#kmHint'); if (hEl) hEl.innerHTML = cptHint(veh(W.vid)); }
  }
  else if (k === 'essNote') W.ess[el.dataset.k].note = el.value;
  else if (k === 'armNote') W.arm.notes[el.dataset.k] = el.value;
  else if (k === 'souT') W.sou[+el.dataset.i].titre = el.value;
  else if (k === 'souN') W.sou[+el.dataset.i].note = el.value;
  else if (k === 'obs') W.obs = el.value;
  clearTimeout(document._dt); document._dt = setTimeout(saveDraft, 400);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lg-nom') ACT.login(); if (e.key === 'Enter' && e.target.id === 'pin') ACT.adminOk(); });
window.addEventListener('online', () => { S.online = true; sync(true); });
window.addEventListener('offline', () => { S.online = false; paintSync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg && S.user) sync(true); });

/* ---------- activation par lien / QR code ---------- */
(function activationFromHash() {
  const me = location.hash.match(/engin=([a-z0-9-]+)/);
  if (me) S.pendingEngin = me[1];
  const m = location.hash.match(/activer=([A-Za-z0-9_-]+)/);
  if (!m) { if (me) history.replaceState(null, '', location.pathname + location.search); return; }
  try {
    const c = JSON.parse(unb64url(m[1]));
    if (c.o && c.r && c.t) { S.cfg = { o: c.o, r: c.r, t: c.t, b: c.b || 'main' }; LS.set('mv.cfg', S.cfg); S.tree = []; S.files = {}; LS.set('mv.tree', []); LS.set('mv.files', {}); reindex(); setTimeout(() => toast('Téléphone relié au centre ✔'), 300); }
  } catch (e) { setTimeout(() => toast('Lien d’activation invalide', true), 300); }
  history.replaceState(null, '', location.pathname + location.search);
})();

if (W && S.user) S.view = 'home';
render();
openPendingEngin();
if (S.cfg) sync(true);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
